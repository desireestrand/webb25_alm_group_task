name: Run Tests to Main

on: 
  push: 
    branches: 
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: npm install
      - name: Set up environment variables using Secrets
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV
      - name: Run tests
        run: npm run test